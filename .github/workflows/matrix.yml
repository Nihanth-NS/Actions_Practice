name: Matrix
on:
    push:
        paths-ignore: 
            - .github/workflows/index.yml
            - .github/workflows/testing.yml
    workflow_dispatch:
jobs:
    Job_1:
        strategy:
            fail-fast: False # it is default true which when 1 job fails every job will be cancelled.
            max-parallel: 1  #runs only 1 jobs at a time. 
            matrix:
                os: [ubuntu-latest, ubuntu-22.04, windows-latest] #to run on multiple OS at same time
                images: [hello-world, alpine] #multiple images
                exclude: # This is used to exclude a specific for example here alpine will excluded on ruuning in windows-latest OS.
                    - images: alpine
                      os: windows-latest 
                include: # This will includes new specific here we run new images on ubuntu 20.04 OS.
                    - images: amd64/alpine
                      os: ubuntu-22.04
        runs-on: ${{ matrix.os }}
        steps:
        - name: Echo Docker details
          run: docker info
        
        - name: Run image on ${{ matrix.os }}
          run: docker run ${{ matrix.images }}



    